name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - luigilink
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        **Do not paste real tenant data** (tenant names, site URLs, owner names, client IDs, usage reports) in this issue: replace it with made-up values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - 0.x
        - Other
      default: 0
    validations:
      required: true
  - type: dropdown
    id: powershell
    attributes:
      label: What version of PowerShell are you running?
      multiple: true
      options:
        - 7.4
        - 7.5
        - 7.6
        - Other
  - type: input
    id: pnp
    attributes:
      label: PnP.PowerShell version
      placeholder: ex. 3.1.0
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output, with real tenant data replaced. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/luigilink/SPSSiteLifecycle/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
