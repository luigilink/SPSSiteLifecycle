# DEBUG ONLY, never merge: finds why the Windows job stalls in the Size tests of tests/StrictCsv.Tests.ps1.

name: DEBUG Windows stall in StrictCsv

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.case }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, case: full }
          - { os: windows-latest, case: file }
          - { os: windows-latest, case: test }
          - { os: windows-latest, case: scaling }
          - { os: windows-latest, case: raw }
          - { os: windows-latest, case: others }
          - { os: ubuntu-latest, case: scaling }
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Environment
        run: ./.github/debug/environment.ps1

      - name: Install Pester
        run: |
          Install-Module -Name Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Install dotnet-stack
        continue-on-error: true
        run: |
          dotnet tool install --global dotnet-stack

      - name: Run the case
        run: ./.github/debug/run.ps1 -Case ${{ matrix.case }}

      - name: Upload the monitor log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: monitor-${{ matrix.os }}-${{ matrix.case }}
          path: ${{ runner.temp }}/monitor.log
          if-no-files-found: warn
